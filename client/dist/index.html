  <body>
    <div id="root"></div>


    <!-- Auto reload (dev only) -->
    <script>
      (function () {
        var firstConnect = true;
        var retryDelay = 1000;

        function connect() {
          var sse = new EventSource("/api/sse/reload");

          sse.addEventListener("connected", function () {
            if (firstConnect) {
              firstConnect = false;
              retryDelay = 1000;
              console.log(
                "%c[AutoReload] Connected — watching updates.",
                "color:#57F287;font-weight:600"
              );
            } else {
              console.log(
                "%c[AutoReload] Update detected — reloading...",
                "color:#FEE75C;font-weight:600"
              );
              window.location.reload();
            }
          });

          sse.onerror = function () {
            sse.close();
            console.log(
              "%c[AutoReload] Disconnected — retrying...",
              "color:#ED4245"
            );

            setTimeout(function () {
              retryDelay = Math.min(retryDelay * 2, 15000);
              connect();
            }, retryDelay);
          };
        }

        connect();
      })();
    </script>
