<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Portal</title>
    <link rel="icon" type="image/webp" href="https://cdn.discordapp.com/icons/1487744336908124190/4235733b69bbdcb75e2479404e2eaaa1.webp?size=64" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-CzmNTBYu.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CPM9qPDh.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var firstConnect = true;
        var retryDelay = 1000;

        function connect() {
          var sse = new EventSource('/api/sse/reload');

          sse.addEventListener('connected', function () {
            if (firstConnect) {
              firstConnect = false;
              retryDelay = 1000;
              console.log('%c[AutoReload] Connected — will auto-refresh when the server updates.', 'color:#57F287;font-weight:600');
            } else {
              console.log('%c[AutoReload] Server updated — reloading page...', 'color:#FEE75C;font-weight:600');
              window.location.reload();
            }
          });

          sse.onerror = function () {
            sse.close();
            console.log('%c[AutoReload] Connection lost — retrying in ' + (retryDelay / 1000) + 's...', 'color:#ED4245');
            setTimeout(function () {
              retryDelay = Math.min(retryDelay * 2, 15000);
              connect();
            }, retryDelay);
          };
        }

        connect();
      })();
    </script>
  </body>
</html>
