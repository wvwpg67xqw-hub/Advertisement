kind = "web"
previewPath = "/"
title = "Bot Status"
version = "1.0.0"
id = "artifacts/bot-status"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3001

[services.development]
run = "pnpm --filter @workspace/bot-status run dev"

[services.production]
build = [ "echo", "skip" ]
publicDir = "artifacts/bot-status/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3001"
BASE_PATH = "/"
