kind = "api"
previewPath = "/health"
title = "Discord Bot"
version = "1.0.0"
id = "discord-bot"

[[services]]
localPort = 20320
name = "Discord Bot"
paths = ["/health"]

[services.development]
run = "pnpm --filter @workspace/discord-bot run dev"

[services.production]

[services.production.run]
args = ["node", "artifacts/discord-bot/src/index.js"]

[services.production.run.env]
PORT = "20320"
NODE_ENV = "production"
